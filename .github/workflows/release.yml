name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "按 versionName 打 tag（v<版本>）并发布 Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-strict-match: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置发布证书，APK 将使用临时 debug 签名"
          fi

      - name: Build & Collect APKs
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist

          # 分步构建标准版与下载版（内置 yt-dlp，不出通用包），错开双变体并发打包与签名的内存/磁盘峰值
          ./gradlew assembleStandardRelease --stacktrace --no-daemon || ./gradlew assembleStandardRelease --refresh-dependencies --stacktrace --no-daemon
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            mv "app/build/outputs/apk/standard/release/app-standard-$abi-release.apk" "dist/Voxtitle-$VERSION-$abi.apk"
          done
          rm -rf app/build/outputs/apk/standard \
                 app/build/intermediates/merged_native_libs/standardRelease \
                 app/build/intermediates/stripped_native_libs/standardRelease

          ./gradlew assembleYtdlpRelease --stacktrace --no-daemon || ./gradlew assembleYtdlpRelease --refresh-dependencies --stacktrace --no-daemon
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "app/build/outputs/apk/ytdlp/release/app-ytdlp-$abi-release.apk" "dist/Voxtitle-dl-$VERSION-$abi.apk"
          done
          rm -rf app/build/outputs/apk/ytdlp \
                 app/build/intermediates/merged_native_libs/ytdlpRelease \
                 app/build/intermediates/stripped_native_libs/ytdlpRelease

          ls -lh dist
          df -h
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: android-apks
          path: dist/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-strict-match: true

      - name: Cache Windows TDLib Native (tdjni.dll)
        uses: actions/cache@v4
        with:
          path: desktop-windows/src/main/resources/tdlib/native/win-x64
          key: tdjni-win-x64-4c6377aa73-v1

      - name: Prepare Windows TDLib Native (tdjni.dll)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $resDir = "desktop-windows/src/main/resources/tdlib/native/win-x64"
          New-Item -ItemType Directory -Force -Path $resDir | Out-Null
          if (Test-Path "$resDir/tdjni.dll") {
            Write-Host "已从缓存命中 Windows tdjni.dll"
            Get-ChildItem $resDir
            exit 0
          }
          $gradleTxt = Get-Content "desktop-windows/build.gradle.kts" -Raw
          $tdTag = [regex]::Match($gradleTxt, 'val tdlibTag = "([^"]+)"').Groups[1].Value
          $tdYml = Get-Content ".github/workflows/tdlib.yml" -Raw
          $tdCommit = [regex]::Match($tdYml, 'default:\s*([0-9a-f]{40})').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($tdCommit)) { $tdCommit = "4c6377aa7386c39217878a9a56d581922ad37ca4" }

          Write-Host "尝试从 Release ($tdTag) 下载预编译 tdjni-windows-x64.zip..."
          gh release download "$tdTag" -p "tdjni-windows-x64.zip" -D "$env:RUNNER_TEMP" --repo "${{ github.repository }}" 2>$null
          if (Test-Path "$env:RUNNER_TEMP/tdjni-windows-x64.zip") {
            Expand-Archive -LiteralPath "$env:RUNNER_TEMP/tdjni-windows-x64.zip" -DestinationPath $resDir -Force
            $dllNames = Get-ChildItem "$resDir/*.dll" | Select-Object -ExpandProperty Name | Sort-Object
            Set-Content -Path "$resDir/manifest.txt" -Value ($dllNames -join "`n") -Encoding UTF8
            Write-Host "成功加载预编译 tdjni-windows-x64.zip"
            Get-ChildItem $resDir
            exit 0
          }

          try {
            Write-Host "Release 中尚未存在 tdjni-windows-x64.zip，开始自动编译 Windows x64 tdjni.dll ($tdCommit)..."
            if (-not (Get-Command php -ErrorAction SilentlyContinue)) {
              if (Test-Path "C:\tools\php") {
                $env:PATH = "C:\tools\php;$env:PATH"
              } else {
                choco install php -y --no-progress
                $phpDir = Get-ChildItem "C:\tools\php*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($phpDir) { $env:PATH = "$($phpDir.FullName);$env:PATH" }
              }
            }
            $vcpkg = $env:VCPKG_INSTALLATION_ROOT
            if ([string]::IsNullOrWhiteSpace($vcpkg) -or -not (Test-Path "$vcpkg\vcpkg.exe")) {
              git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
              & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
              $vcpkg = "$env:RUNNER_TEMP\vcpkg"
            }
            & "$vcpkg\vcpkg.exe" install gperf:x64-windows openssl:x64-windows zlib:x64-windows
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
            $gperfExe = "$vcpkg\installed\x64-windows\tools\gperf\gperf.exe"
            $env:PATH = "$vcpkg\installed\x64-windows\tools\gperf;$vcpkg\installed\x64-windows\bin;$env:PATH"

            $tdSrc = "$env:RUNNER_TEMP\td-src"
            git clone https://github.com/tdlib/td.git $tdSrc
            Push-Location $tdSrc
            git checkout $tdCommit
            Pop-Location

            $env:JAVA_HOME = $env:JAVA_HOME.Replace('\', '/')
            $javaHome = $env:JAVA_HOME
            $vcpkgToolchain = "$vcpkg/scripts/buildsystems/vcpkg.cmake".Replace('\', '/')
            $gperfPath = $gperfExe.Replace('\', '/')

            New-Item -ItemType Directory -Force -Path "$tdSrc\build" | Out-Null
            Push-Location "$tdSrc\build"
            cmake -A x64 `
              -DCMAKE_INSTALL_PREFIX:PATH="../example/java/td" `
              -DTD_ENABLE_JNI=ON `
              -DGPERF_EXECUTABLE:FILEPATH="$gperfPath" `
              -DJAVA_HOME:PATH="$javaHome" `
              -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$vcpkgToolchain" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DCMAKE_POLICY_DEFAULT_CMP0219=NEW `
              ..
            if ($LASTEXITCODE -ne 0) { throw "CMake configure td failed" }
            cmake --build . --target install --config Release -- /m:2
            if ($LASTEXITCODE -ne 0) { throw "CMake build td failed" }
            Pop-Location

            New-Item -ItemType Directory -Force -Path "$tdSrc\example\java\build" | Out-Null
            Push-Location "$tdSrc\example\java\build"
            $tdCmakeDir = (Resolve-Path "../td/lib/cmake/Td").Path.Replace('\', '/')
            cmake -A x64 `
              -DCMAKE_INSTALL_PREFIX:PATH="../../../tdlib-win" `
              -DJAVA_HOME:PATH="$javaHome" `
              -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$vcpkgToolchain" `
              -DVCPKG_TARGET_TRIPLET=x64-windows `
              -DTd_DIR:PATH="$tdCmakeDir" `
              -DCMAKE_POLICY_DEFAULT_CMP0219=NEW `
              ..
            if ($LASTEXITCODE -ne 0) { throw "CMake configure tdjni failed" }
            cmake --build . --target tdjni --config Release -- /m:2
            if ($LASTEXITCODE -ne 0) { throw "CMake build tdjni failed" }
            Pop-Location

            $tdjniDll = Get-ChildItem -Path $tdSrc -Recurse -Filter "tdjni.dll" | Select-Object -First 1
            if (-not $tdjniDll) { throw "tdjni.dll not found after build" }
            Copy-Item $tdjniDll.FullName "$resDir/tdjni.dll" -Force
            Get-ChildItem "$vcpkg\installed\x64-windows\bin\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "$resDir/$($_.Name)" -Force
            }
            if ($env:VCToolsRedistDir) {
              Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item $_.FullName "$resDir/$($_.Name)" -Force
              }
            }
            $dllNames = Get-ChildItem "$resDir/*.dll" | Select-Object -ExpandProperty Name | Sort-Object
            Set-Content -Path "$resDir/manifest.txt" -Value ($dllNames -join "`n") -Encoding UTF8
            Get-ChildItem $resDir

            # 同步回传到对应 TDLib Release，后续所有构建直接秒级复用
            $zipOut = "$env:RUNNER_TEMP\tdjni-windows-x64.zip"
            Compress-Archive -Path "$resDir\*" -DestinationPath $zipOut -Force
            gh release upload "$tdTag" $zipOut --repo "${{ github.repository }}" --clobber 2>$null
          } catch {
            Write-Warning "自动编译 Windows TDLib native 遇到异常: $_"
            Write-Warning "主程序将继续打包发布；TDLib 原生库后续可通过在线拉取或手动导入启用。"
          }
          $global:LASTEXITCODE = 0

      - name: Build Windows Packages
        run: |
          .\gradlew.bat -p desktop-windows packageDistributionForCurrentOS createDistributable --no-daemon

      - name: Print jpackage Logs on Failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "desktop-windows/build/compose/logs" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content $_.FullName
          }

      - name: Collect Windows Binaries
        shell: pwsh
        run: |
          $ver = (Get-Content app/build.gradle.kts | Select-String 'versionName = "([^"]+)"').Matches.Groups[1].Value
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item "desktop-windows/build/compose/binaries/main/exe/Voxtitle-*.exe" "dist/Voxtitle-$ver-windows-x64-Setup.exe" -ErrorAction SilentlyContinue
          Copy-Item "desktop-windows/build/compose/binaries/main/msi/Voxtitle-*.msi" "dist/Voxtitle-$ver-windows-x64.msi" -ErrorAction SilentlyContinue
          Compress-Archive -Path "desktop-windows/build/compose/binaries/main/app/Voxtitle/*" -DestinationPath "dist/Voxtitle-$ver-windows-x64-portable.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v5
        with:
          name: windows-binaries
          path: dist/*

  publish-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect All Release Assets
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 推送 tag 触发时用该 tag；手动运行时按 versionName 在当前提交上新建 tag
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$VERSION"; fi
          EXTRA_FLAGS=""
          if [[ "$TAG" == *-* ]]; then EXTRA_FLAGS="--prerelease"; fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "译幕 Voxtitle $TAG" \
            --notes-file .github/release-notes.md \
            ${EXTRA_FLAGS:+$EXTRA_FLAGS} || \
          gh release upload "$TAG" dist/* --clobber
