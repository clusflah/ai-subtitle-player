name: Build Android 6 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "android6-compat" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build & Verify Android 6.0 Adaptation
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardDebug testStandardDebugUnitTest processYtdlpReleaseMainManifest --stacktrace --no-daemon

      - name: Upload Android 6.0 APK Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ai-subtitle-player-android6-apk
          path: app/build/outputs/apk/standard/debug/*.apk
