name: Build Android 6 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "android6-compat" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Debug APK (Standard)
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardDebug --stacktrace --no-daemon

      - name: Upload Android 6.0 APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-subtitle-player-android6-apk
          path: app/build/outputs/apk/standard/debug/*.apk
