# 从 Telegram 官方源码（tdlib/td）编译安卓用的 TDLib（Java 接口），作为预发布的 Release 存起来；
# App 编译时按 app/build.gradle.kts 里写的版本和 SHA-256 下载。只在升级 TDLib 时手动运行。
name: Build TDLib

on:
  workflow_dispatch:
    inputs:
      commit:
        description: tdlib/td 的提交号
        required: true
        default: 4c6377aa7386c39217878a9a56d581922ad37ca4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK: 23.2.8568313
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq default-jdk g++ git gperf make perl php-cli unzip wget

      - name: Checkout TDLib
        run: |
          git clone https://github.com/tdlib/td.git
          cd td
          git checkout "${{ inputs.commit }}"

      - name: Build
        working-directory: td/example/android
        run: |
          ./fetch-sdk.sh SDK "$NDK"
          ./build-openssl.sh SDK "$NDK" openssl OpenSSL_1_1_1w
          # 最低 Android 8（API 26，和 App 一样）；架构和 App 的分包一样
          ./build-tdlib.sh SDK "$NDK" openssl c++_static Java 26 "arm64-v8a armeabi-v7a x86_64"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'project\(TDLib VERSION \K[0-9.]+' td/CMakeLists.txt)
          commit="${{ inputs.commit }}"
          tag="tdlib-$version-${commit:0:10}"
          cp td/example/android/tdlib/tdlib.zip "$tag.zip"
          unzip -l "$tag.zip" | head -30
          sha=$(sha256sum "$tag.zip" | cut -d' ' -f1)
          echo "$sha  $tag.zip"
          gh release create "$tag" "$tag.zip" --repo "${{ github.repository }}" --prerelease --latest=false \
            --title "TDLib $version (${commit:0:10})" \
            --notes "从 https://github.com/tdlib/td/commit/$commit 用官方 example/android 脚本编译（NDK $NDK、OpenSSL 1.1.1w、API 26）。App 编译时下载，不是译幕的发布版本。SHA-256: $sha"
