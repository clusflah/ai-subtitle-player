# 从 Telegram 官方源码（tdlib/td）编译 Android（Java + .so）与 Windows x64（tdjni.dll + 依赖 DLL），
# 作为预发布的 Release 存起来；App 与桌面端编译时自动拉取并内置。
name: Build TDLib

on:
  workflow_dispatch:
    inputs:
      commit:
        description: tdlib/td 的提交号
        required: true
        default: 4c6377aa7386c39217878a9a56d581922ad37ca4

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK: 23.2.8568313
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq default-jdk g++ git gperf make perl php-cli unzip wget

      - name: Checkout TDLib
        run: |
          git clone https://github.com/tdlib/td.git
          cd td
          git checkout "${{ inputs.commit }}"

      - name: Build Android TDLib
        working-directory: td/example/android
        run: |
          ./fetch-sdk.sh SDK "$NDK"
          ./build-openssl.sh SDK "$NDK" openssl OpenSSL_1_1_1w
          # 最低 Android 6.0（API 23，和 App 一样）；架构和 App 的分包一样
          ./build-tdlib.sh SDK "$NDK" openssl c++_static Java 23 "arm64-v8a armeabi-v7a x86_64"

      - name: Publish Android TDLib Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oP 'project\(TDLib VERSION \K[0-9.]+' td/CMakeLists.txt)
          commit="${{ inputs.commit }}"
          tag="tdlib-$version-${commit:0:10}"
          cp td/example/android/tdlib/tdlib.zip "$tag.zip"
          unzip -l "$tag.zip" | head -30
          sha=$(sha256sum "$tag.zip" | cut -d' ' -f1)
          echo "$sha  $tag.zip"
          gh release create "$tag" "$tag.zip" --repo "${{ github.repository }}" --prerelease --latest=false \
            --title "TDLib $version (${commit:0:10})" \
            --notes "从 https://github.com/tdlib/td/commit/$commit 编译（Android NDK $NDK API 23 + Windows x64 tdjni.dll）。SHA-256: $sha" || \
          gh release upload "$tag" "$tag.zip" --repo "${{ github.repository }}" --clobber

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Checkout TDLib
        shell: pwsh
        run: |
          git clone https://github.com/tdlib/td.git td
          Push-Location td
          git checkout "${{ inputs.commit }}"
          Pop-Location

      - name: Build Windows x64 tdjni.dll
        shell: pwsh
        run: |
          if (-not (Get-Command php -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\tools\php") {
              $env:PATH = "C:\tools\php;$env:PATH"
            } else {
              choco install php -y --no-progress
              $phpDir = Get-ChildItem "C:\tools\php*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($phpDir) { $env:PATH = "$($phpDir.FullName);$env:PATH" }
            }
          }
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkg) -or -not (Test-Path "$vcpkg\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
            & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
            $vcpkg = "$env:RUNNER_TEMP\vcpkg"
          }
          & "$vcpkg\vcpkg.exe" install gperf:x64-windows openssl:x64-windows zlib:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          $gperfExe = "$vcpkg\installed\x64-windows\tools\gperf\gperf.exe"
          $env:PATH = "$vcpkg\installed\x64-windows\tools\gperf;$vcpkg\installed\x64-windows\bin;$env:PATH"

          $env:JAVA_HOME = $env:JAVA_HOME.Replace('\', '/')
          $javaHome = $env:JAVA_HOME
          $vcpkgToolchain = "$vcpkg/scripts/buildsystems/vcpkg.cmake".Replace('\', '/')
          $gperfPath = $gperfExe.Replace('\', '/')

          New-Item -ItemType Directory -Force -Path "td\build" | Out-Null
          Push-Location "td\build"
          cmake -A x64 `
            -DCMAKE_INSTALL_PREFIX:PATH="../example/java/td" `
            -DTD_ENABLE_JNI=ON `
            -DGPERF_EXECUTABLE:FILEPATH="$gperfPath" `
            -DJAVA_HOME:PATH="$javaHome" `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_POLICY_DEFAULT_CMP0219=NEW `
            ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configure td failed" }
          cmake --build . --target install --config Release -- /m:2
          if ($LASTEXITCODE -ne 0) { throw "CMake build td failed" }
          Pop-Location

          New-Item -ItemType Directory -Force -Path "td\example\java\build" | Out-Null
          Push-Location "td\example\java\build"
          $tdDir = (Resolve-Path "../td/lib/cmake/Td").Path.Replace('\', '/')
          cmake -A x64 `
            -DCMAKE_INSTALL_PREFIX:PATH="../../../tdlib-win" `
            -DJAVA_HOME:PATH="$javaHome" `
            -DCMAKE_TOOLCHAIN_FILE:FILEPATH="$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DTd_DIR:PATH="$tdDir" `
            -DCMAKE_POLICY_DEFAULT_CMP0219=NEW `
            ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configure tdjni failed" }
          cmake --build . --target tdjni --config Release -- /m:2
          if ($LASTEXITCODE -ne 0) { throw "CMake build tdjni failed" }
          Pop-Location

          New-Item -ItemType Directory -Force -Path "win-out" | Out-Null
          $tdjniDll = Get-ChildItem -Path "td" -Recurse -Filter "tdjni.dll" | Select-Object -First 1
          if (-not $tdjniDll) { throw "tdjni.dll not found after build" }
          Copy-Item $tdjniDll.FullName "win-out\tdjni.dll" -Force
          Get-ChildItem "$vcpkg\installed\x64-windows\bin\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "win-out\$($_.Name)" -Force
          }
          if ($env:VCToolsRedistDir) {
            Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "win-out\$($_.Name)" -Force
            }
          }
          $dllNames = Get-ChildItem "win-out\*.dll" | Select-Object -ExpandProperty Name | Sort-Object
          Set-Content -Path "win-out\manifest.txt" -Value ($dllNames -join "`n") -Encoding UTF8
          Compress-Archive -Path "win-out\*" -DestinationPath "tdjni-windows-x64.zip" -Force
          Get-ChildItem "win-out"

      - name: Upload Windows TDLib Asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cmakeTxt = Get-Content "td\CMakeLists.txt" -Raw
          $version = [regex]::Match($cmakeTxt, 'project\(TDLib VERSION ([0-9.]+)').Groups[1].Value
          $commit = "${{ inputs.commit }}"
          $short = $commit.Substring(0, 10)
          $tag = "tdlib-$version-$short"
          gh release upload "$tag" "tdjni-windows-x64.zip" --repo "${{ github.repository }}" --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" "tdjni-windows-x64.zip" --repo "${{ github.repository }}" --prerelease --latest=false `
              --title "TDLib $version ($short)" `
              --notes "TDLib Windows x64 native JNI bundle ($commit)"
          }
